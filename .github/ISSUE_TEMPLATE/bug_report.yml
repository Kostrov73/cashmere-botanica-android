name: Bug report / Сообщить об ошибке
description: Report a problem in Cashmere Botanica / Сообщить о проблеме в приложении
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened? / Что произошло?
      description: Describe the problem clearly. / Опишите проблему.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / Как повторить ошибку?
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version / Версия Android
      placeholder: "For example: Android 14"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs / Скриншоты или логи
    validations:
      required: false
